<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Управление картами и башнями — Clash Royale</title>
    <meta name="description" content="Укажите, какие карты, башни, эволюции и героизмы у вас есть" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="wrap management">
        <header class="page-header">
            <div class="title-group">
                <h1>📋 Управление коллекцией</h1>
                <p>Кликните по карте или башне, чтобы отметить её как отсутствующую. Повторный клик вернёт статус «найдено»</p>
            </div>
            <div class="header-controls">
                <a href="index.html" class="nav-link">Вернуться к генератору</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">🌙</button>
            </div>
        </header>

        <section class="panel">
            <div class="filters">
                <input type="text" id="searchInput" placeholder="Поиск по имени…" />
                <select id="rarityFilter">
                    <option value="">Все редкости</option>
                    <option value="common">Common</option>
                    <option value="rare">Rare</option>
                    <option value="epic">Epic</option>
                    <option value="legendary">Legendary</option>
                    <option value="champion">Champion</option>
                </select>
                <select id="typeFilter">
                    <option value="">Все типы</option>
                    <option value="troop">Troop</option>
                    <option value="spell">Spell</option>
                    <option value="building">Building</option>
                </select>
            </div>

            <div class="stats">
                <div class="stats-row">
                    <span>Карт всего: <strong id="totalCards">0</strong></span>
                    <span>Карт найдено: <strong id="ownedCardsCount">0</strong></span>
                </div>
                <div class="stats-row">
                    <span>Башен всего: <strong id="totalTowers">0</strong></span>
                    <span>Башен найдено: <strong id="ownedTowersCount">0</strong></span>
                </div>
            </div>

            <div class="actions-bar">
                <button class="primary" id="saveBtn">Сохранить</button>
                <button id="resetAllBtn">Сбросить всё</button>
                <button id="selectAllBtn">Найти всё</button>
            </div>

            <div class="section-title">Башни</div>
            <div class="towers-grid" id="towersContainer"></div>

            <div class="section-title">Карты</div>
            <div class="cards-grid" id="cardsContainer"></div>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="generator.js"></script>
    <script src="common.js"></script>
    <script>
        (function() {
            const api = window.ClashRoyaleGenerator;
            const common = window.ClashRoyaleCommon;
            if (!api) {
                document.body.innerHTML = '<p style="color:var(--danger);padding:2rem;text-align:center;">Ошибка: generator.js не загружен.</p>';
                return;
            }

            // DOM
            const searchInput = document.getElementById('searchInput');
            const rarityFilter = document.getElementById('rarityFilter');
            const typeFilter = document.getElementById('typeFilter');
            const towersContainer = document.getElementById('towersContainer');
            const cardsContainer = document.getElementById('cardsContainer');
            const totalCardsEl = document.getElementById('totalCards');
            const ownedCardsCountEl = document.getElementById('ownedCardsCount');
            const totalTowersEl = document.getElementById('totalTowers');
            const ownedTowersCountEl = document.getElementById('ownedTowersCount');
            const toast = document.getElementById('toast');
            const panel = document.querySelector('.panel');
            const saveBtn = document.getElementById('saveBtn');

            let allCards = [];
            let towersData = [];
            let ownedCards = common.loadOwnedCards();
            let ownedTowers = common.loadOwnedTowers();
            let evoOwned = common.loadOwnedMap(common.STORAGE_KEYS.EVO);
            let heroismOwned = common.loadOwnedMap(common.STORAGE_KEYS.HEROISM);
            const alwaysCards = common.getAlwaysOwnedCards();
            const alwaysTowers = common.getAlwaysOwnedTowers();

            // Тема
            document.getElementById('themeToggle').addEventListener('click', common.toggleTheme);
            common.loadTheme();

            function escapeHtml(str) { return common.escapeHtml(str); }

            // Сохранение
            function saveAll() {
                common.saveOwnedCards(ownedCards);
                common.saveOwnedTowers(ownedTowers);
                common.saveOwnedMap(common.STORAGE_KEYS.EVO, evoOwned);
                common.saveOwnedMap(common.STORAGE_KEYS.HEROISM, heroismOwned);
                updateStats();
                showToast('✅ Настройки сохранены');
            }

            // Тост
            let toastTimer = null;
            function showToast(msg, isError = false) {
                toast.textContent = msg;
                toast.style.background = isError ? 'var(--danger)' : 'var(--panel)';
                toast.style.color = isError ? '#fff' : 'var(--text)';
                toast.style.borderColor = isError ? 'var(--danger)' : 'var(--border)';
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
            }

            // Анимация кнопки
            let pressTimer = null;
            function animatePress(btn) {
                if (pressTimer) clearTimeout(pressTimer);
                btn.classList.add('pressed', 'no-hover');
                pressTimer = setTimeout(() => {
                    btn.classList.remove('pressed');
                    pressTimer = null;
                }, 300);
            }
            function triggerWave() {
                panel.classList.remove('wave-active');
                void panel.offsetWidth;
                panel.classList.add('wave-active');
                setTimeout(() => panel.classList.remove('wave-active'), 700);
            }
            saveBtn.addEventListener('click', function(e) {
                animatePress(this);
                triggerWave();
                saveAll();
            });
            saveBtn.addEventListener('mouseleave', function() {
                this.classList.remove('no-hover');
            });

            // Рендеринг башен
            function renderTowers() {
                towersContainer.innerHTML = '';
                let ownedCount = 0;

                towersData.forEach(tower => {
                    const name = tower.name;
                    const isAlways = alwaysTowers.has(name);
                    const isOwned = ownedTowers.has(name) || isAlways;
                    if (isOwned) ownedCount++;

                    const div = document.createElement('div');
                    div.className = 'tower-item' + (isOwned ? '' : ' not-found');
                    if (isAlways) div.classList.add('always-owned');
                    div.dataset.name = name;

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'name';
                    nameDiv.textContent = name;
                    div.appendChild(nameDiv);

                    const sub = document.createElement('div');
                    sub.className = 'sub';
                    const rarity = common.getTowerRarity(name);
                    const rarityLabel = rarity ? `<span class="badge rarity-${rarity.toLowerCase()}">${rarity}</span>` : '';
                    sub.innerHTML = `${rarityLabel} ID ${tower.id}`;
                    div.appendChild(sub);

                    if (!isAlways) {
                        div.style.cursor = 'pointer';
                    } else {
                        div.style.cursor = 'default';
                        div.title = 'Всегда доступна';
                    }

                    towersContainer.appendChild(div);
                });
                totalTowersEl.textContent = towersData.length;
                ownedTowersCountEl.textContent = ownedCount;
            }

            // Рендеринг карт
            function renderCards() {
                const search = searchInput.value.toLowerCase().trim();
                const rarity = rarityFilter.value.toLowerCase();
                const type = typeFilter.value.toLowerCase();

                cardsContainer.innerHTML = '';
                let ownedCount = 0;

                allCards.forEach(card => {
                    const key = card.key || String(card.id);
                    const name = card.name || '';
                    const cardRarity = (card.rarity || '').toLowerCase();
                    const cardType = (card.type || '').toLowerCase();
                    const isAlways = alwaysCards.has(key);
                    const isOwned = ownedCards.has(key) || isAlways;

                    const matchesSearch = name.toLowerCase().includes(search);
                    const matchesRarity = !rarity || cardRarity === rarity;
                    const matchesType = !type || cardType === type;
                    if (!matchesSearch || !matchesRarity || !matchesType) return;

                    if (isOwned) ownedCount++;

                    const div = document.createElement('div');
                    div.className = 'card-item' + (isOwned ? '' : ' not-found');
                    if (isAlways) div.classList.add('always-owned');
                    div.dataset.key = key;

                    const info = document.createElement('div');
                    info.className = 'info';
                    const nameEl = document.createElement('div');
                    nameEl.className = 'name';
                    nameEl.textContent = name;
                    const sub = document.createElement('div');
                    sub.className = 'sub';
                    const rarityClass = cardRarity ? `rarity-${cardRarity}` : '';
                    const rarityLabel = cardRarity ? `<span class="badge ${rarityClass}">${cardRarity}</span>` : '';
                    sub.innerHTML = `${rarityLabel} ${cardType} · ID ${card.id}`;
                    info.appendChild(nameEl);
                    info.appendChild(sub);
                    div.appendChild(info);

                    const iconsHtml = common.buildCardIcons(card, 0, evoOwned, heroismOwned, false);
                    if (iconsHtml) {
                        const wrapper = document.createElement('div');
                        wrapper.innerHTML = iconsHtml;
                        div.appendChild(wrapper.firstElementChild);
                    }

                    if (!isAlways) {
                        div.style.cursor = 'pointer';
                    } else {
                        div.style.cursor = 'default';
                        div.title = 'Всегда доступна';
                    }

                    cardsContainer.appendChild(div);
                });

                totalCardsEl.textContent = allCards.length;
                ownedCardsCountEl.textContent = ownedCount;
            }

            function updateStats() {
                const ownedCount = allCards.filter(c => {
                    const key = c.key || String(c.id);
                    return ownedCards.has(key) || alwaysCards.has(key);
                }).length;
                ownedCardsCountEl.textContent = ownedCount;
                ownedTowersCountEl.textContent = ownedTowers.size + alwaysTowers.size;
                totalCardsEl.textContent = allCards.length;
                totalTowersEl.textContent = towersData.length;
            }

            // Переключение карты/башни с проверкой на "всегда доступно"
            function toggleCard(key) {
                if (alwaysCards.has(key)) {
                    showToast('🔒 Эта карта всегда доступна');
                    return;
                }
                if (ownedCards.has(key)) ownedCards.delete(key);
                else ownedCards.add(key);
                renderCards();
                updateStats();
            }

            function toggleTower(name) {
                if (alwaysTowers.has(name)) {
                    showToast('🔒 Эта башня всегда доступна');
                    return;
                }
                if (ownedTowers.has(name)) ownedTowers.delete(name);
                else ownedTowers.add(name);
                renderTowers();
                updateStats();
            }

            // Обработчики кликов
            towersContainer.addEventListener('click', function(e) {
                const item = e.target.closest('.tower-item');
                if (!item) return;
                const name = item.dataset.name;
                if (!name) return;
                toggleTower(name);
            });

            cardsContainer.addEventListener('click', function(e) {
                const item = e.target.closest('.card-item');
                if (!item) return;
                if (e.target.closest('.card-icon-btn')) return;
                const key = item.dataset.key;
                if (!key) return;
                toggleCard(key);
            });

            cardsContainer.addEventListener('click', function(e) {
                const btn = e.target.closest('.card-icon-btn');
                if (!btn) return;
                const kind = btn.dataset.kind;
                const key = btn.dataset.key;
                const map = kind === 'evolution' ? evoOwned : heroismOwned;
                const storageKey = kind === 'evolution' ? common.STORAGE_KEYS.EVO : common.STORAGE_KEYS.HEROISM;
                map[key] = !map[key];
                common.saveOwnedMap(storageKey, map);
                renderCards();
                updateStats();
            });

            // Кнопки действий
            document.getElementById('resetAllBtn').addEventListener('click', function() {
                if (!confirm('Сбросить все настройки (кроме всегда доступных карт и башен)?')) return;
                ownedCards = new Set([...alwaysCards]);
                ownedTowers = new Set([...alwaysTowers]);
                evoOwned = {};
                heroismOwned = {};
                saveAll();
                renderTowers();
                renderCards();
                updateStats();
                showToast('🔄 Сброшены все настройки (кроме обязательных)');
            });

            document.getElementById('selectAllBtn').addEventListener('click', function() {
                allCards.forEach(c => {
                    const key = c.key || String(c.id);
                    if (!alwaysCards.has(key)) ownedCards.add(key);
                });
                renderCards();
                updateStats();
                showToast('✅ Все карты найдены (кроме обязательных)');
            });

            // Фильтры
            searchInput.addEventListener('input', renderCards);
            rarityFilter.addEventListener('change', renderCards);
            typeFilter.addEventListener('change', renderCards);

            // Инициализация
            async function init() {
                try {
                    const raw = await api.loadCards();
                    allCards = api.prepareCards(raw);
                    towersData = Object.entries(api.TOWER_TROOPS).map(([name, id]) => ({ name, id }));

                    if (ownedCards.size === 0 && localStorage.getItem(common.STORAGE_KEYS.OWNED_CARDS) === null) {
                        allCards.forEach(c => ownedCards.add(c.key || String(c.id)));
                    } else {
                        alwaysCards.forEach(key => ownedCards.add(key));
                    }
                    if (ownedTowers.size === 0 && localStorage.getItem(common.STORAGE_KEYS.OWNED_TOWERS) === null) {
                        towersData.forEach(t => ownedTowers.add(t.name));
                    } else {
                        alwaysTowers.forEach(name => ownedTowers.add(name));
                    }

                    renderTowers();
                    renderCards();
                    updateStats();
                } catch (e) {
                    showToast('❌ Ошибка загрузки cards.json', true);
                }
            }

            init();
        })();
    </script>
</body>
</html>
