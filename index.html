<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clash Royale — генератор колод</title>
  <meta name="description" content="Случайный генератор колод Clash Royale" />
  <script>
    // Применяем сохранённую тему ещё до отрисовки страницы, чтобы не было
    // "мигания" тёмной темой перед переключением на светлую.
    (function() {
      try {
        var stored = localStorage.getItem('cr-theme');
        var isLight = stored ? stored === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
        if (isLight) document.documentElement.classList.add('light-theme');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <div class="title-group">
        <h1>Случайная колода</h1>
        <p>Это полностью сгенерированный нейросетью генератор абсолютно случайных колод в Clash Royale без всяких правил</p>
      </div>
      <div class="header-controls">
        <a href="cards.html" class="nav-link">Изменить данные о картах и башнях</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">🌙</button>
      </div>
    </header>

    <section class="panel" id="mainPanel">
      <div class="actions">
        <button id="generate">Сгенерировать колоду</button>
        <a id="deckLink" class="link" target="_blank" style="display:none;">Открыть колоду</a>
      </div>

      <div class="options">
        <label><input type="checkbox" id="showDeck" checked> Показывать колоду</label>
        <label><input type="checkbox" id="showTower" checked> Показывать башню</label>
        <label><input type="checkbox" id="evoSort"> Сортировка по способностям</label>
        <label><input type="checkbox" id="tournamentMode"> Турнирный уровень</label>
      </div>

      <div class="reset-actions">
        <button type="button" id="resetEvo" class="btn-reset">Сбросить данные об эволюциях</button>
        <button type="button" id="resetHeroism" class="btn-reset">Сбросить данные о героизме</button>
      </div>

      <div id="status" class="status">Загрузка базы карт…</div>
      <div id="deck" class="deck"></div>
      <div id="tower" class="tower" hidden></div>
    </section>
  </main>

  <script src="generator.js"></script>
  <script src="common.js"></script>
  <script>
    (function() {
      const api = window.ClashRoyaleGenerator;
      const common = window.ClashRoyaleCommon;
      const generateBtn = document.getElementById("generate");
      const deckLink = document.getElementById("deckLink");
      const statusEl = document.getElementById("status");
      const deckEl = document.getElementById("deck");
      const towerEl = document.getElementById("tower");
      const panel = document.getElementById("mainPanel");
      const themeToggle = document.getElementById("themeToggle");

      const showDeckCb = document.getElementById("showDeck");
      const showTowerCb = document.getElementById("showTower");
      const evoSortCb = document.getElementById("evoSort");
      const tournamentCb = document.getElementById("tournamentMode"); // новый

      const resetEvoBtn = document.getElementById("resetEvo");
      const resetHeroismBtn = document.getElementById("resetHeroism");

      let allCards = [];
      let currentUrl = "";
      let pressTimer = null;

      let originalDeck = null;
      let currentDeck = null;
      let currentTowerName = "";
      let currentTowerId = null;

      let evoOwned = common.loadOwnedMap(common.STORAGE_KEYS.EVO);
      let heroismOwned = common.loadOwnedMap(common.STORAGE_KEYS.HEROISM);

      // Восстанавливаем состояние турнирного режима
      try {
        const saved = localStorage.getItem('cr-tournament-mode');
        if (saved !== null) tournamentCb.checked = saved === 'true';
      } catch (_) {}

      tournamentCb.addEventListener('change', function() {
        try { localStorage.setItem('cr-tournament-mode', String(tournamentCb.checked)); } catch (_) {}
        refreshDeck(); // обновить отображение иконок (перерисовать колоду)
        updateStatusMessage();
      });

      // Тема
      themeToggle.addEventListener('click', common.toggleTheme);
      common.loadTheme();

      function escapeHtml(str) { return common.escapeHtml(str); }

      function getAvailableCardsCount() {
        if (tournamentCb.checked) return allCards.length;
        const ownedCardsSet = common.loadOwnedCards();
        const alwaysCardsSet = common.getAlwaysOwnedCards();
        return allCards.filter(card =>
          ownedCardsSet.has(card.key) || alwaysCardsSet.has(card.key)
        ).length;
      }

      function updateStatusMessage() {
        // В турнирном режиме доступны все карты, показывать счётчик незачем
        if (tournamentCb.checked) {
          statusEl.textContent = '';
          return;
        }
        const available = getAvailableCardsCount();
        statusEl.textContent = `В генерации участвуют ${available}/${allCards.length} карт`;
      }

      // Сброс эво/героизм
      resetEvoBtn.addEventListener('click', function() {
        evoOwned = {};
        common.saveOwnedMap(common.STORAGE_KEYS.EVO, evoOwned);
        refreshDeck();
      });

      resetHeroismBtn.addEventListener('click', function() {
        heroismOwned = {};
        common.saveOwnedMap(common.STORAGE_KEYS.HEROISM, heroismOwned);
        refreshDeck();
      });

      // Отображение
      function updateVisibility() {
        deckEl.classList.toggle('hidden', !showDeckCb.checked);
        towerEl.classList.toggle('hidden', !showTowerCb.checked);
      }
      showDeckCb.addEventListener('change', updateVisibility);
      showTowerCb.addEventListener('change', updateVisibility);

      function renderDeck(deck) {
        const tournament = tournamentCb.checked;
        // При турнирном режиме передаём фиктивные объекты, чтобы иконки рисовались залитыми
        const evoForIcons = tournament ? new Proxy({}, { get: () => true }) : evoOwned;
        const heroForIcons = tournament ? new Proxy({}, { get: () => true }) : heroismOwned;

        deckEl.innerHTML = deck.map((card, i) => `
          <article class="card" data-slot-index="${i}">
            ${common.buildCardIcons(card, i, evoForIcons, heroForIcons, tournament)}
            <div class="number">СЛОТ ${i + 1}</div>
            <div class="name">${escapeHtml(card.name)}</div>
            <div class="id">ID: ${escapeHtml(String(card.id))}</div>
          </article>
        `).join("");
      }

      deckEl.addEventListener('click', function(e) {
        const btn = e.target.closest('.card-icon-btn');
        if (!btn) return;
        // Если турнирный режим – клики по иконкам заблокированы (они не кнопки)
        if (tournamentCb.checked) return;
        const cardEl = btn.closest('.card');
        if (!cardEl) return;

        const kind = btn.dataset.kind;
        const key = btn.dataset.key;
        const map = kind === 'evolution' ? evoOwned : heroismOwned;
        const storageKey = kind === 'evolution' ? common.STORAGE_KEYS.EVO : common.STORAGE_KEYS.HEROISM;

        map[key] = !map[key];
        common.saveOwnedMap(storageKey, map);
        refreshDeck();
      });

      // Обновляет только иконки эволюции/героизма внутри уже существующих
      // карточек, не трогая сами карточки — чтобы не запускалась заново
      // анимация появления.
      function updateCardIconsInPlace(deck) {
        const tournament = tournamentCb.checked;
        const evoForIcons = tournament ? new Proxy({}, { get: () => true }) : evoOwned;
        const heroForIcons = tournament ? new Proxy({}, { get: () => true }) : heroismOwned;

        deck.forEach((card, i) => {
          const cardEl = deckEl.querySelector(`.card[data-slot-index="${i}"]`);
          if (!cardEl) return;
          const existingIcons = cardEl.querySelector('.card-icons');
          if (existingIcons) existingIcons.remove();
          const newIconsHtml = common.buildCardIcons(card, i, evoForIcons, heroForIcons, tournament);
          if (newIconsHtml) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = newIconsHtml;
            cardEl.insertBefore(wrapper.firstElementChild, cardEl.firstChild);
          }
        });
      }

      function refreshDeck() {
        if (!originalDeck) return;

        const tournament = tournamentCb.checked;
        // Для сортировки – при турнирном режиме все способности считаются доступными
        const evoForSort = tournament ? new Proxy({}, { get: () => true }) : evoOwned;
        const heroForSort = tournament ? new Proxy({}, { get: () => true }) : heroismOwned;

        const sorted = evoSortCb.checked
          ? api.applyEvoSort([...originalDeck], evoForSort, heroForSort)
          : [...originalDeck];

        const keyOf = c => c && (c.key || String(c.id));
        const orderChanged = !currentDeck
          || sorted.length !== currentDeck.length
          || sorted.some((card, i) => keyOf(card) !== keyOf(currentDeck[i]));

        currentDeck = sorted;

        currentUrl = api.makeDeckUrl(currentDeck, currentTowerId);
        deckLink.href = currentUrl;
        deckLink.style.display = "inline-flex";

        if (orderChanged) {
          // Карты реально поменялись местами – перерисовываем с анимацией появления
          renderDeck(currentDeck);
        } else {
          // Порядок карт не изменился (например, просто отметили эволюцию/героизм) –
          // обновляем только иконки, без повторной анимации появления
          updateCardIconsInPlace(currentDeck);
        }
        updateVisibility();
      }

      evoSortCb.addEventListener('change', refreshDeck);

      function animatePress() {
        if (pressTimer) clearTimeout(pressTimer);
        generateBtn.classList.add('pressed', 'no-hover');
        pressTimer = setTimeout(() => {
          generateBtn.classList.remove('pressed');
          pressTimer = null;
        }, 300);
      }
      generateBtn.addEventListener('mouseleave', function() {
        generateBtn.classList.remove('no-hover');
      });

      function triggerWave() {
        panel.classList.remove('wave-active');
        void panel.offsetWidth;
        panel.classList.add('wave-active');
        setTimeout(() => panel.classList.remove('wave-active'), 700);
      }

      async function generate() {
        try {
          generateBtn.disabled = true;
          statusEl.classList.remove('error');

          const tournament = tournamentCb.checked;
          let availableCards;
          let towerKeys;

          if (tournament) {
            // Турнирный режим – все карты и все башни доступны
            availableCards = allCards;
            towerKeys = Object.keys(api.TOWER_TROOPS);
          } else {
            const ownedCardsSet = common.loadOwnedCards();
            const ownedTowersSet = common.loadOwnedTowers();
            const alwaysCardsSet = common.getAlwaysOwnedCards();
            const alwaysTowersSet = common.getAlwaysOwnedTowers();

            availableCards = allCards.filter(card =>
              ownedCardsSet.has(card.key) || alwaysCardsSet.has(card.key)
            );
            towerKeys = Object.keys(api.TOWER_TROOPS).filter(name =>
              ownedTowersSet.has(name) || alwaysTowersSet.has(name)
            );
            if (towerKeys.length === 0) towerKeys = Object.keys(api.TOWER_TROOPS);
          }

          if (availableCards.length < 8) {
            statusEl.classList.add('error');
            statusEl.textContent = `Недостаточно карт (нужно минимум 8, доступно ${availableCards.length}). Отметьте больше карт в управлении коллекцией.`;
            deckLink.style.display = "none";
            return;
          }

          const towerName = towerKeys[Math.floor(Math.random() * towerKeys.length)];
          const towerId = api.TOWER_TROOPS[towerName];
          currentTowerName = towerName;
          currentTowerId = towerId;

          triggerWave();

          let deck = api.generateDeck(availableCards);
          originalDeck = deck;

          const evoForSort = tournament ? new Proxy({}, { get: () => true }) : evoOwned;
          const heroForSort = tournament ? new Proxy({}, { get: () => true }) : heroismOwned;

          const sorted = evoSortCb.checked
            ? api.applyEvoSort([...originalDeck], evoForSort, heroForSort)
            : [...originalDeck];
          currentDeck = sorted;

          currentUrl = api.makeDeckUrl(currentDeck, currentTowerId);
          deckLink.href = currentUrl;
          deckLink.style.display = "inline-flex";

          renderDeck(currentDeck);
          towerEl.hidden = false;
          towerEl.innerHTML = `<strong>🏰 Башня: ${escapeHtml(towerName)}</strong><span>ID: ${towerId}</span>`;

          updateStatusMessage();
          statusEl.classList.remove('error');

          updateVisibility();
        } catch (error) {
          statusEl.classList.add('error');
          statusEl.textContent = error.message || String(error);
          deckLink.style.display = "none";
        } finally {
          generateBtn.disabled = false;
        }
      }

      generateBtn.addEventListener("click", function(e) {
        animatePress();
        generate();
      });

      async function init() {
        try {
          const raw = await api.loadCards();
          allCards = api.prepareCards(raw);
          statusEl.textContent = `Загружено обычных карт: ${allCards.length}`;
          await generate();
        } catch (error) {
          statusEl.classList.add('error');
          statusEl.textContent = `Ошибка загрузки базы: ${error.message || error}`;
          generateBtn.disabled = true;
        }
      }

      init();
    })();
  </script>
</body>
</html>
