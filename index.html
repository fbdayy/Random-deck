<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clash Royale — генератор колод</title>
  <meta name="description" content="Случайный генератор колод Clash Royale" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <div class="title-group">
        <h1>🎲 Случайная колода</h1>
        <p>Это полностью сгенерированный нейросетью генератор абсолютно случайных колод в Clash Royale без всяких правил.</p>
      </div>
      <div class="header-controls">
        <a href="cards.html" class="nav-link">изменить данные о картах и башнях</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">🌙</button>
      </div>
    </header>

    <section class="panel" id="mainPanel">
      <div class="actions">
        <button id="generate">Сгенерировать колоду</button>
        <a id="deckLink" class="link" target="_blank" style="display:none;">Открыть колоду</a>
      </div>

      <div class="options">
        <label><input type="checkbox" id="showDeck" checked> Показывать колоду</label>
        <label><input type="checkbox" id="showTower" checked> Показывать башню</label>
        <label><input type="checkbox" id="evoSort"> Сортировка по способностям</label>
      </div>

      <div class="reset-actions">
        <button type="button" id="resetEvo" class="btn-reset">Сбросить данные об эволюциях</button>
        <button type="button" id="resetHeroism" class="btn-reset">Сбросить данные о героизме</button>
      </div>

      <div id="status" class="status">Загрузка базы карт…</div>
      <div id="deck" class="deck"></div>
      <div id="tower" class="tower" hidden></div>
    </section>
  </main>

  <script src="generator.js"></script>
  <script>
    (function() {
      const api = window.ClashRoyaleGenerator;
      const generateBtn = document.getElementById("generate");
      const deckLink = document.getElementById("deckLink");
      const statusEl = document.getElementById("status");
      const deckEl = document.getElementById("deck");
      const towerEl = document.getElementById("tower");
      const panel = document.getElementById("mainPanel");
      const themeToggle = document.getElementById("themeToggle");

      const showDeckCb = document.getElementById("showDeck");
      const showTowerCb = document.getElementById("showTower");
      const evoSortCb = document.getElementById("evoSort");

      const resetEvoBtn = document.getElementById("resetEvo");
      const resetHeroismBtn = document.getElementById("resetHeroism");

      let cards = [];
      let currentUrl = "";
      let pressTimer = null;

      let originalDeck = null;
      let currentDeck = null;
      let currentTowerName = "";
      let currentTowerId = null;

      function setTheme(theme) {
        const isLight = theme === 'light';
        document.body.classList.toggle('light-theme', isLight);
        themeToggle.textContent = isLight ? '☀️' : '🌙';
      }

      function toggleTheme() {
        const current = document.body.classList.contains('light-theme') ? 'light' : 'dark';
        const next = current === 'light' ? 'dark' : 'light';
        setTheme(next);
        try {
          localStorage.setItem('cr-theme', next);
        } catch (_) { /* ignore */ }
      }

      function loadTheme() {
        let stored = null;
        try {
          stored = localStorage.getItem('cr-theme');
        } catch (_) { /* ignore */ }
        if (stored) {
          setTheme(stored);
          return;
        }
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        setTheme(prefersLight ? 'light' : 'dark');
      }

      themeToggle.addEventListener('click', toggleTheme);

      function loadOwnedMap(storageKey) {
        try {
          const raw = localStorage.getItem(storageKey);
          return raw ? JSON.parse(raw) : {};
        } catch (_) {
          return {};
        }
      }

      function saveOwnedMap(storageKey, map) {
        try {
          localStorage.setItem(storageKey, JSON.stringify(map));
        } catch (_) { /* ignore */ }
      }

      let evoOwned = loadOwnedMap('cr-evo-owned');
      let heroismOwned = loadOwnedMap('cr-heroism-owned');

      function isHeroRarity(card) {
        return String(card.rarity ?? '').toLowerCase() === 'champion';
      }
      function canEvolve(card) {
        return Boolean(card.has_evolution);
      }
      function canHeroism(card) {
        return Boolean(card.has_heroism);
      }

      function computeIconState(ownedMap, key, slotIndex, kind) {
        const owned = Boolean(ownedMap[key]);
        if (!owned) return 1;
        let isSpecialSlot;
        if (kind === 'heroism') {
          isSpecialSlot = (slotIndex === 1 || slotIndex === 2);
        } else {
          isSpecialSlot = (slotIndex === 0 || slotIndex === 2);
        }
        return isSpecialSlot ? 3 : 2;
      }

      const RING = `<circle class="icon-ring" cx="18" cy="18" r="15"></circle>`;
      
      const HERO_SHIELD_SVG = `
        <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" focusable="false">
          ${RING}
          <path class="icon-shape" d="M18 6 L28 10 L28 20 C28 28 18 32 18 32 C18 32 8 28 8 20 L8 10 Z M18 12 L22 15 L20 21 L16 21 L14 15 Z" />
        </svg>
      `;
      
      const HEROISM_STAR_SVG = `
        <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" focusable="false">
          ${RING}
          <path class="icon-shape" d="M18 6 L20.9 14 L18 14 Z" />
          <path class="icon-shape" d="M18 6 L15.1 14 L18 14 Z" />
          <path class="icon-shape" d="M29.4 14.3 L20.9 14 L21.85 16.75 Z" />
          <path class="icon-shape" d="M29.4 14.3 L22.8 19.5 L21.85 16.75 Z" />
          <path class="icon-shape" d="M25.1 27.7 L22.8 19.5 L20.4 21.25 Z" />
          <path class="icon-shape" d="M25.1 27.7 L18 23 L20.4 21.25 Z" />
          <path class="icon-shape" d="M10.9 27.7 L18 23 L15.6 21.25 Z" />
          <path class="icon-shape" d="M10.9 27.7 L13.2 19.5 L15.6 21.25 Z" />
          <path class="icon-shape" d="M6.6 14.3 L13.2 19.5 L14.15 16.75 Z" />
          <path class="icon-shape" d="M6.6 14.3 L15.1 14 L14.15 16.75 Z" />
          <path class="icon-shape" d="M18 14 L21.85 16.75 L20.4 21.25 L15.6 21.25 L14.15 16.75 Z" />
        </svg>
      `;
      
      const EVO_AMETHYST_SVG = `
        <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" focusable="false">
          ${RING}
          <path class="icon-shape" d="M18 7 L29 18 L18 29 L7 18 Z" />
        </svg>
      `;
      
      function buildCardIcons(card, slotIndex) {
        const parts = [];
      
        if (isHeroRarity(card)) {
          parts.push(`<span class="card-icon hero-icon" title="Герой">${HERO_SHIELD_SVG}</span>`);
        }
      
        if (canEvolve(card)) {
          const owned = Boolean(evoOwned[card.key]);
          const state = computeIconState(evoOwned, card.key, slotIndex, 'evolution');
          parts.push(`
            <button type="button" class="card-icon-btn" data-kind="evolution" data-key="${escapeHtml(String(card.key ?? card.id))}" data-state="${state}"
              aria-pressed="${owned}" aria-label="Эволюция: ${owned ? 'есть' : 'нет'}"
              title="Отметить, есть ли у вас эволюция этой карты">
              ${EVO_AMETHYST_SVG}
            </button>
          `);
        }
      
        if (canHeroism(card)) {
          const owned = Boolean(heroismOwned[card.key]);
          const state = computeIconState(heroismOwned, card.key, slotIndex, 'heroism');
          parts.push(`
            <button type="button" class="card-icon-btn" data-kind="heroism" data-key="${escapeHtml(String(card.key ?? card.id))}" data-state="${state}"
              aria-pressed="${owned}" aria-label="Героизм: ${owned ? 'есть' : 'нет'}"
              title="Отметить, есть ли у вас героизм этой карты">
              ${HEROISM_STAR_SVG}
            </button>
          `);
        }
      
        if (!parts.length) return '';
        return `<div class="card-icons">${parts.join('')}</div>`;
      }

      function renderDeck(deck) {
        deckEl.innerHTML = deck.map((card, i) => `
          <article class="card" data-slot-index="${i}">
            ${buildCardIcons(card, i)}
            <div class="number">СЛОТ ${i + 1}</div>
            <div class="name">${escapeHtml(card.name)}</div>
            <div class="id">ID: ${escapeHtml(String(card.id))}</div>
          </article>
        `).join("");
      }

      deckEl.addEventListener('click', function(e) {
        const btn = e.target.closest('.card-icon-btn');
        if (!btn) return;
        const cardEl = btn.closest('.card');
        if (!cardEl) return;

        const kind = btn.dataset.kind;
        const key = btn.dataset.key;

        const map = kind === 'evolution' ? evoOwned : heroismOwned;
        const storageKey = kind === 'evolution' ? 'cr-evo-owned' : 'cr-heroism-owned';

        const owned = !map[key];
        map[key] = owned;
        saveOwnedMap(storageKey, map);

        refreshDeck();
      });

      resetEvoBtn.addEventListener('click', function() {
        evoOwned = {};
        saveOwnedMap('cr-evo-owned', evoOwned);
        refreshDeck();
      });

      resetHeroismBtn.addEventListener('click', function() {
        heroismOwned = {};
        saveOwnedMap('cr-heroism-owned', heroismOwned);
        refreshDeck();
      });

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, c => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[c]));
      }

      function updateVisibility() {
        const showDeck = showDeckCb.checked;
        const showTower = showTowerCb.checked;
        deckEl.classList.toggle('hidden', !showDeck);
        towerEl.classList.toggle('hidden', !showTower);
      }

      showDeckCb.addEventListener('change', updateVisibility);
      showTowerCb.addEventListener('change', updateVisibility);

      function animatePress() {
        if (pressTimer) {
          clearTimeout(pressTimer);
          generateBtn.classList.remove('pressed');
        }
        generateBtn.classList.add('pressed');
        generateBtn.classList.add('no-hover');
        pressTimer = setTimeout(() => {
          generateBtn.classList.remove('pressed');
          pressTimer = null;
        }, 300);
      }

      generateBtn.addEventListener('mouseleave', function() {
        generateBtn.classList.remove('no-hover');
      });

      function triggerWave() {
        panel.classList.remove('wave-active');
        void panel.offsetWidth;
        panel.classList.add('wave-active');
        setTimeout(() => {
          panel.classList.remove('wave-active');
        }, 700);
      }

      function refreshDeck() {
        if (!originalDeck) return;

        const sorted = evoSortCb.checked 
          ? api.applyEvoSort([...originalDeck], evoOwned, heroismOwned) 
          : [...originalDeck];
        currentDeck = sorted;

        currentUrl = api.makeDeckUrl(currentDeck, currentTowerId);
        deckLink.href = currentUrl;
        deckLink.style.display = "inline-flex";

        renderDeck(currentDeck);
        updateVisibility();
      }

      async function generate() {
        try {
          generateBtn.disabled = true;
          statusEl.classList.remove('error');
          statusEl.textContent = "Генерирую…";

          triggerWave();

          let deck = api.generateDeck(cards);
          originalDeck = deck;

          const towerKeys = Object.keys(api.TOWER_TROOPS);
          const towerName = towerKeys[Math.floor(Math.random() * towerKeys.length)];
          const towerId = api.TOWER_TROOPS[towerName];
          currentTowerName = towerName;
          currentTowerId = towerId;

          const sorted = evoSortCb.checked 
            ? api.applyEvoSort([...originalDeck], evoOwned, heroismOwned) 
            : [...originalDeck];
          currentDeck = sorted;

          currentUrl = api.makeDeckUrl(currentDeck, currentTowerId);
          deckLink.href = currentUrl;
          deckLink.style.display = "inline-flex";

          renderDeck(currentDeck);
          towerEl.hidden = false;
          towerEl.innerHTML = `<strong>🏰 Башня: ${escapeHtml(towerName)}</strong><span>tt: ${towerId}</span>`;

          statusEl.textContent = "";

          updateVisibility();
        } catch (error) {
          statusEl.classList.add('error');
          statusEl.textContent = error.message || String(error);
          deckLink.style.display = "none";
        } finally {
          generateBtn.disabled = false;
        }
      }

      async function init() {
        try {
          const raw = await api.loadCards();
          cards = api.prepareCards(raw);
          statusEl.textContent = `Загружено обычных карт: ${cards.length}`;
          await generate();
        } catch (error) {
          statusEl.classList.add('error');
          statusEl.textContent = `Ошибка загрузки базы: ${error.message || error}`;
          generateBtn.disabled = true;
        }
      }

      generateBtn.addEventListener("click", function(e) {
        animatePress();
        generate();
      });

      evoSortCb.addEventListener('change', refreshDeck);

      loadTheme();
      init();
    })();
  </script>
</body>
</html>
